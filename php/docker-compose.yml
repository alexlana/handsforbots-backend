services:
  php_server:
    image: php:8.2-apache
    container_name: alx-chatbot-backend
    volumes:
      - ./app:/var/www/html
      - ./logs:/var/log/apache2
      - ./llm_logs:/tmp/llm_logs
      - ./php_errors:/tmp/php_errors
    ports:
      - "8081:80"  # Mudando para porta 8081 para evitar conflito
    networks:
      - teste-docker_alxbotnet  # Usando a rede correta do repositório principal
    env_file:
      - .env
    working_dir: /app
